name: docker

# Trigger có develop: trước đây workflow này chỉ chạy trên main/master, nghĩa là image Docker
# KHÔNG BAO GIỜ được build trên nhánh đang code — lỗi Dockerfile chỉ lộ ra lúc release.
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: flintflow-be:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Image thiếu assets/ là lỗi đã xảy ra một lần (prompt-registry đọc <cwd>/assets lúc chạy).
      # Rẻ hơn nhiều so với phát hiện nó khi container production không khởi động được.
      - name: Image có assets, fixtures và dist
        run: |
          docker run --rm --entrypoint sh flintflow-be:ci -c '
            test -f dist/server.js &&
            test -d assets/skills &&
            test -f assets/step-registry.json &&
            test -d fixtures
          '

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      # Image FE build từ repo anh em; repo public nên GITHUB_TOKEN mặc định đọc được.
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: mit-suu/flintflow_fe
          ref: develop

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: flintflow-fe:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Image có .next, public và next.config
        run: |
          docker run --rm --entrypoint sh flintflow-fe:ci -c '
            test -d .next && test -d public && test -f next.config.ts
          '

  # DoD T24: `docker compose up -d && curl /health` phải trả mongo: ok, plantuml: ok.
  # Đây là thứ duy nhất chứng minh compose (replica set + mạng nội bộ + biến môi trường) thật sự chạy.
  compose-health:
    runs-on: ubuntu-latest
    needs: [backend-image, frontend-image]
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend vào thư mục anh em
        uses: actions/checkout@v4
        with:
          repository: mit-suu/flintflow_fe
          ref: develop
          path: .frontend

      - name: docker compose config hợp lệ
        env:
          FRONTEND_CONTEXT: ./.frontend
        run: docker compose config > /dev/null

      # Không dựng frontend ở job này: nó chỉ là `next start`, không nói gì thêm về sức khoẻ hệ thống,
      # mà build mất vài phút. `frontend-image` ở trên đã chứng minh image FE build được.
      - name: docker compose up (mongo + plantuml + backend)
        env:
          FRONTEND_CONTEXT: ./.frontend
          JWT_ACCESS_SECRET: ci-access-secret-must-be-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-characters
        run: docker compose up -d --wait --wait-timeout 300 mongo mongo-init plantuml backend

      - name: /health trả mongo ok + plantuml ok
        run: |
          body=$(curl -sf --retry 10 --retry-delay 3 --retry-all-errors http://localhost:5000/health)
          echo "$body"
          echo "$body" | grep -q '"mongo":"ok"'    || { echo "mongo không ok"; exit 1; }
          echo "$body" | grep -q '"plantuml":"ok"' || { echo "plantuml không ok"; exit 1; }

      # Replica set là lý do mongo chạy `--replSet`; kiểm bằng chính đường mà op engine đi.
      - name: Transaction dùng được (replica set rs0)
        run: |
          docker compose exec -T mongo mongosh --quiet --eval '
            const s = db.getMongo().startSession();
            s.startTransaction();
            s.getDatabase("flintflow").smoke.insertOne({ ok: 1 });
            s.commitTransaction();
            print("transaction ok");
          '

      - name: Log khi hỏng
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Dọn
        if: always()
        run: docker compose down -v
