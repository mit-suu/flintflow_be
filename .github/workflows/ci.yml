name: backend-ci

# Trigger bao gồm develop và refactor_codebase_v3: trước đây CI chỉ chạy trên
# main/master, nghĩa là KHÔNG BAO GIỜ chạy trên nhánh đang code.
on:
  push:
    branches:
      - main
      - master
      - develop
      - refactor_codebase_v3
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck bao gồm cả file test (tsconfig.json), còn build thì không
      # (tsconfig.build.json) để dist/ không chứa test.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build project
        run: npm run build
