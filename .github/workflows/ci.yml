name: backend-ci

# Trigger bao gồm develop và refactor_codebase_v3: trước đây CI chỉ chạy trên
# main/master, nghĩa là KHÔNG BAO GIỜ chạy trên nhánh đang code.
on:
  push:
    branches:
      - main
      - master
      - develop
      - refactor_codebase_v3
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck bao gồm cả file test (tsconfig.json), còn build thì không
      # (tsconfig.build.json) để dist/ không chứa test.
      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck test code
        run: npm run typecheck:test

      # mongodb-memory-server tải binary mongod lần đầu (~70 MB) — cache giữa các lượt chạy
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Unit (src/**) + integration (test/integration/**, Mongo in-memory + supertest).
      # e2e-ai (provider thật) không chạy ở CI; ngưỡng coverage lõi nằm trong vitest.config.ts.
      - name: Test (unit + integration, coverage)
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build project
        run: npm run build
